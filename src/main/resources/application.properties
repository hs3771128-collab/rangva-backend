spring.application.name=sb-ecom

# Render/Railway style hosts hand the port in PORT; local dev falls back to 8080.
server.port=${PORT:8080}

#H2 Database
#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:

project.image=${PROJECT_IMAGE:images/}

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.fromate_sql=true
#spring.jpa.hibernate.ddl-auto=update

# Signing key for JWTs. MUST be set on a public deployment (Render generates one
# for you, or paste a long random value). When it is empty the app generates a
# random key at startup, which is fine for local dev but logs everyone out on
# restart. Never commit a real secret to git.
spring.app.jwtSecret=${SPRING_APP_JWTSECRET:}
spring.app.jwtExpirationMs=3000000
spring.ecom.app.jwtCookieName=springBootEcom



#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.com.ecommerce.project=DEBUG

#PostgreSQL Database (active - project runs on PostgreSQL 17)
#Change these values (or set them as environment variables) to match your PostgreSQL setup
spring.datasource.url=${PG_DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${PG_DB_USERNAME:postgres}
spring.datasource.password=${PG_DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

#Hibernate creates/updates the tables automatically
#For the very first run you can use "create" to build the schema from scratch
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

#Dialect is auto-detected from the PostgreSQL connection, so no need to set it
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#MySQL Database (not used - project runs on PostgreSQL)
#spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
#spring.datasource.username=root
#spring.datasource.password=12345
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Oracle Database (not used - Oracle service OS 1053 issue)
#spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
#spring.datasource.username=ecommerce
#spring.datasource.password=12345
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}

# ---------------------------------------------------------------------------
# Deployment
# Browser clients on another origin (the static storefront) are allowed via
# APP_CORS_ALLOWED_ORIGINS (comma separated). Cookies need SameSite=None and
# Secure when the API and the storefront live on different domains.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# ---------------------------------------------------------------------------
# Demo data
# The live database is the source of truth: nothing is inserted on startup.
# To populate a brand new database once, start the app with
#   app.seed.enabled=true
# (or set APP_SEED_ENABLED=true), then switch it back to false.
# ---------------------------------------------------------------------------
app.seed.enabled=false

# Demo accounts (user1 / seller1 / admin). Keep true locally; set
# APP_SEED_DEMO_USERS=false on a real deployment so the well-known dev logins
# are never created. APP_SEED_ADMIN_PASSWORD, when set, creates the admin with
# that password and also rotates an existing admin's password on startup.
app.seed.demo-users-enabled=${APP_SEED_DEMO_USERS:true}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}

# ---------------------------------------------------------------------------
# Payment gateways (Pakistan)
# Credentials are read from environment variables so they never live in git.
# Set ENABLED=true only after the matching credentials are provided.
#
# JazzCash merchant form (hosted checkout):
#   JAZZCASH_MERCHANT_ID / JAZZCASH_PASSWORD / JAZZCASH_INTEGRITY_SALT
# Easypaisa Easypay (hosted checkout):
#   EASYPAISA_STORE_ID / EASYPAISA_HASH_KEY
#
# PAYMENTS_BACKEND_BASE_URL must be a PUBLIC https URL that the gateway can
# reach (use ngrok while developing on localhost).
# ---------------------------------------------------------------------------
app.payments.frontend-return-url=${PAYMENTS_FRONTEND_RETURN_URL:http://localhost:5173/order-confirm}
app.payments.frontend-base-url=${PAYMENTS_FRONTEND_BASE_URL:http://localhost:5173}
app.payments.backend-base-url=${PAYMENTS_BACKEND_BASE_URL:http://localhost:8080}

# Development only: lets the checkout simulate gateways that have no
# credentials yet (JazzCash / Easypaisa / Safepay). No real money moves.
# MUST stay false in production; the app refuses to start with this on and a
# "prod"/"production" profile active.
app.payments.test-mode=${PAYMENTS_TEST_MODE:false}

app.payments.jazzcash.enabled=${JAZZCASH_ENABLED:false}
app.payments.jazzcash.sandbox=${JAZZCASH_SANDBOX:true}
app.payments.jazzcash.merchant-id=${JAZZCASH_MERCHANT_ID:}
app.payments.jazzcash.password=${JAZZCASH_PASSWORD:}
app.payments.jazzcash.integrity-salt=${JAZZCASH_INTEGRITY_SALT:}
app.payments.jazzcash.version=${JAZZCASH_VERSION:1.1}
app.payments.jazzcash.txn-type=${JAZZCASH_TXN_TYPE:MWALLET}
app.payments.jazzcash.language=${JAZZCASH_LANGUAGE:EN}
# Optional override, e.g. a dedicated production endpoint from JazzCash
#app.payments.jazzcash.checkout-url=

app.payments.easypaisa.enabled=${EASYPAISA_ENABLED:false}
app.payments.easypaisa.sandbox=${EASYPAISA_SANDBOX:true}
app.payments.easypaisa.store-id=${EASYPAISA_STORE_ID:}
app.payments.easypaisa.hash-key=${EASYPAISA_HASH_KEY:}
# MA = mobile account, OTC = over-the-counter, CC = card
app.payments.easypaisa.payment-method=${EASYPAISA_PAYMENT_METHOD:MA}
app.payments.easypaisa.email=${EASYPAISA_EMAIL:}
#app.payments.easypaisa.checkout-url=

# Safepay card checkout (Visa / Mastercard) — hosted page, cards never touch us.
# Get sandbox keys from the Safepay dashboard: Developers → API keys.
# The webhook secret is shown when you create the webhook (or in its settings).
app.payments.safepay.enabled=${SAFEPAY_ENABLED:false}
app.payments.safepay.sandbox=${SAFEPAY_SANDBOX:true}
app.payments.safepay.api-key=${SAFEPAY_API_KEY:}
app.payments.safepay.secret=${SAFEPAY_SECRET:}
app.payments.safepay.webhook-secret=${SAFEPAY_WEBHOOK_SECRET:}
# Optional endpoint overrides (only needed if Safepay hands you dedicated URLs)
#app.payments.safepay.api-base=
#app.payments.safepay.checkout-base=
