image.base.url=http://localhost:8080/images

# ---------------------------------------------------------------------------
# Demo data
# The live database is the source of truth: nothing is inserted on startup.
# To populate a brand new database once, start the app with
#   app.seed.enabled=true
# (or set APP_SEED_ENABLED=true), then switch it back to false.
# ---------------------------------------------------------------------------
app.seed.enabled=false

# ---------------------------------------------------------------------------
# Payment gateways (Pakistan)
# Credentials are read from environment variables so they never live in git.
# Set ENABLED=true only after the matching credentials are provided.
#
# JazzCash merchant form (hosted checkout):
#   JAZZCASH_MERCHANT_ID / JAZZCASH_PASSWORD / JAZZCASH_INTEGRITY_SALT
# Easypaisa Easypay (hosted checkout):
#   EASYPAISA_STORE_ID / EASYPAISA_HASH_KEY
#
# PAYMENTS_BACKEND_BASE_URL must be a PUBLIC https URL that the gateway can
# reach (use ngrok while developing on localhost).
# ---------------------------------------------------------------------------
app.payments.frontend-return-url=${PAYMENTS_FRONTEND_RETURN_URL:http://localhost:5173/order-confirm}
app.payments.backend-base-url=${PAYMENTS_BACKEND_BASE_URL:http://localhost:8080}

app.payments.jazzcash.enabled=${JAZZCASH_ENABLED:false}
app.payments.jazzcash.sandbox=${JAZZCASH_SANDBOX:true}
app.payments.jazzcash.merchant-id=${JAZZCASH_MERCHANT_ID:}
app.payments.jazzcash.password=${JAZZCASH_PASSWORD:}
app.payments.jazzcash.integrity-salt=${JAZZCASH_INTEGRITY_SALT:}
app.payments.jazzcash.version=${JAZZCASH_VERSION:1.1}
app.payments.jazzcash.txn-type=${JAZZCASH_TXN_TYPE:MWALLET}
app.payments.jazzcash.language=${JAZZCASH_LANGUAGE:EN}
# Optional override, e.g. a dedicated production endpoint from JazzCash
#app.payments.jazzcash.checkout-url=

app.payments.easypaisa.enabled=${EASYPAISA_ENABLED:false}
app.payments.easypaisa.sandbox=${EASYPAISA_SANDBOX:true}
app.payments.easypaisa.store-id=${EASYPAISA_STORE_ID:}
app.payments.easypaisa.hash-key=${EASYPAISA_HASH_KEY:}
# MA = mobile account, OTC = over-the-counter, CC = card
app.payments.easypaisa.payment-method=${EASYPAISA_PAYMENT_METHOD:MA}
app.payments.easypaisa.email=${EASYPAISA_EMAIL:}
#app.payments.easypaisa.checkout-url=

# Safepay card checkout (Visa / Mastercard) — hosted page, cards never touch us.
# Get sandbox keys from the Safepay dashboard: Developers → API keys.
# The webhook secret is shown when you create the webhook (or in its settings).
app.payments.safepay.enabled=${SAFEPAY_ENABLED:false}
app.payments.safepay.sandbox=${SAFEPAY_SANDBOX:true}
app.payments.safepay.api-key=${SAFEPAY_API_KEY:}
app.payments.safepay.secret=${SAFEPAY_SECRET:}
app.payments.safepay.webhook-secret=${SAFEPAY_WEBHOOK_SECRET:}
# Optional endpoint overrides (only needed if Safepay hands you dedicated URLs)
#app.payments.safepay.api-base=
#app.payments.safepay.checkout-base=
