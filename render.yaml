# Render Blueprint for the Rangva API.
#
# 1. Push this file, then on render.com choose "New +" -> "Blueprint" and
#    pick this repository.
# 2. Render asks for the values marked `sync: false` (Neon connection details
#    and a one-time admin password).
# 3. After the Netlify site is live, update APP_CORS_ALLOWED_ORIGINS with its
#    exact https URL. If Render gives this service a different hostname,
#    update IMAGE_BASE_URL as well.
services:
  - type: web
    name: rangva-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/public/payments/methods
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PG_DB_URL
        sync: false
      - key: PG_DB_USERNAME
        sync: false
      - key: PG_DB_PASSWORD
        sync: false
      - key: SPRING_APP_JWTSECRET
        generateValue: true
      - key: IMAGE_BASE_URL
        value: https://rangva-api.onrender.com/images
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_COOKIE_SAME_SITE
        value: None
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: APP_SEED_ENABLED
        value: "false"
      - key: APP_SEED_DEMO_USERS
        value: "false"
      - key: APP_SEED_ADMIN_PASSWORD
        sync: false
      - key: PAYMENTS_TEST_MODE
        value: "false"
      - key: JPA_SHOW_SQL
        value: "false"
      - key: JPA_FORMAT_SQL
        value: "false"
